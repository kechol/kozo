# How kozo checks a change in this repository. Replace each command with the repository's own.
version: 1
# Commands that start what the gates need and kozo's sandbox cannot run, such as a database
# container. kozod runs them outside the sandbox before prepare, in a checkout of the default
# branch kept beside the worktree for the task's life, and again there before every later run of
# the worktree, so each starts what is not running and leaves running services alone, as
# `docker compose up -d` does.
services: []
# Commands that stop what services started, such as removing the database container. An eval runs
# them, from the default branch, after each case.
teardown: []
# How many ports each worktree's services and checks take, so that several worktrees check at
# once. kozod picks free ones and gives every command KOZO_PORT_1 and on, and KOZO_TASK_ID, a name
# unique to the worktree, such as for a container project.
ports: 0
# Commands that set up a fresh worktree, such as installing dependencies. They run in kozo's
# sandbox, which may reach other hosts and write the package managers' caches.
prepare: []
# Globs of the repository's test files; kozo tells tests from other files by these alone.
tests: ["**/*.test.*", "**/test_*.py", "**/*_test.go"]
# Globs of files a tool writes, which count apart from the Charter's line and file limits; scope,
# protected paths, review and prove still see them. For example:
# generated: ["bun.lock", "package-lock.json", "pnpm-lock.yaml", "yarn.lock"]
generated: []
gates:
  lint:
    run: echo "replace with the lint command" && exit 1
  test:
    run: echo "replace with the test command" && exit 1
levels:
  fast: [lint]
  full: [lint, test]
  deep: [lint, test]
# Commands that run the changed test files, which must fail without the change, or keep passing
# for work that keeps behaviour, such as a refactor; {files} is replaced with their paths.
prove: []
