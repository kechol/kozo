name: Release

# A push to main opens or updates the changesets version pull request. After it
# merges, the maintainer pushes a `v<version>` tag, which cross-compiles both
# executables and publishes them as a GitHub Release; a stable version also
# updates the formula in the Homebrew tap.

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# One group per ref: a single shared group keeps only one pending run, so a push to main
# could cancel a tag's queued release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Prepare version pull request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Create or update the version pull request
        uses: changesets/action@v2.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version-script: bun run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile

      - name: Validate the tag against the versioned tree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          version=$(bun -e 'console.log((await Bun.file("packages/cli/package.json").json()).version)')
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match the package version $version"
            exit 1
          fi
          if compgen -G ".changeset/*.md" | grep -qv '^.changeset/README.md$'; then
            echo "::error::Pending changesets remain; merge the version pull request before tagging"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Before the build, so a version no changelog has stops the release early.
      - name: Gather the release notes from the changelogs
        run: |
          mkdir -p release
          git ls-files -z '*CHANGELOG.md' |
            xargs -0 bun run scripts/release-notes.ts --version "$VERSION" > release/NOTES.md

      # The same sandbox as CI's test job: kozod refuses to start without it, and its tests need
      # socat to reach this machine's ports.
      - name: Set up the Linux sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat lsof
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bun -e 'await (await import("./packages/verify/src/index.ts")).platformConfine()'
      - run: bun test

      - name: Cross-compile and package
        run: |
          mkdir -p release
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            bun run scripts/compile.ts --target "bun-$target" --outdir "release/$target"
            cp LICENSE README.md "release/$target/"
            tar -czf "release/kozo-$VERSION-$target.tar.gz" -C "release/$target" kozo kozod LICENSE README.md
          done
          (cd release && sha256sum kozo-*.tar.gz > SHA256SUMS.txt)

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--notes-file release/NOTES.md)
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" release/kozo-*.tar.gz release/SHA256SUMS.txt

  tap:
    name: Update the Homebrew tap
    needs: release
    # Prereleases stay off the tap; only a stable version reaches `brew install`.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.2"
      # The formula is built from the published release, so it names the archives users get.
      - name: Write the formula from the release's checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir release
          bun run scripts/formula.ts --version "${TAG#v}" --sums release/SHA256SUMS.txt > kozo.rb
      # The tap's GitHub App is installed only on kechol/homebrew-tap; the token
      # can write that repository's contents and is revoked when the job ends.
      - name: Create a homebrew-tap token
        id: tap-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: kechol
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@v7.0.1
        with:
          repository: kechol/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: tap
      - name: Commit and push the formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p tap/Formula
          cp kozo.rb tap/Formula/kozo.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kozo.rb
          if git diff --cached --quiet; then
            echo "The formula is already at $TAG"
            exit 0
          fi
          git commit --message "kozo ${TAG#v}"
          git push
