name: Docs

# Pull requests and pushes to main that touch the site build it; a v<version> tag publishes it,
# so the published pages always describe a release. GitHub does not apply paths to tag pushes.
on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
    paths:
      - "site/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

# A newer push to a pull request replaces its build; the deploy job keeps its own group.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/configure-pages@v6.0.0
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist

  deploy:
    name: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # One Pages deployment at a time; cancelling one mid-publish can leave the site half replaced.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
